name: chinese-backend

services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-chinese_learning}
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - chinese-learning
    # MongoDB is intentionally not published to the host by default.

  backend:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/${MONGO_DB_NAME:-chinese_learning}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      AUDIO_DIR: /app/data/audio
      MAX_AUDIO_BYTES: ${MAX_AUDIO_BYTES:-10485760}
    volumes:
      - audio_data:/app/data/audio
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      chinese-learning:
        aliases:
          - backend

volumes:
  mongodb_data:
  audio_data:

networks:
  chinese-learning:
    name: chinese-learning
    driver: bridge
